<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Self-Evaluating Lesson Agent{% endblock %}</title>
    <meta name="description" content="An agentic AI system that generates educational lessons and evaluates its own quality through a self-correcting loop.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="/" class="logo" style="text-decoration: none;">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">LessonAgent</span>
                <span class="logo-badge">Self-Evaluating</span>
            </a>
            <nav class="site-nav">
                <a href="/about" class="nav-link {% block nav_about %}{% endblock %}">📖 How It Works</a>
            </nav>
        </div>
    </header>

    <main class="site-main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
